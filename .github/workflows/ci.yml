name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Zero third-party dependencies: nothing to install.
      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: cli smoke
        run: |
          python -m forge.cli --version
          python -m forge.cli doctor

  package:
    name: wheel contains prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      # The restore contract ships inside the wheel; a card without it invites
      # the model to invent its own rules.
      - name: assert packaged prompts
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for want in ("forge/prompts/restore_member.md", "forge/prompts/audit_member.md"):
              assert want in names, f"{want} missing from {wheel}: {names[:10]}"
          print("packaged prompts ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
